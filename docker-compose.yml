services:
  db:
    image: pgvector/pgvector:pg16
    container_name: db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: zc20040714
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
#      network: host
    container_name: web
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: user  
      DB_PASSWORD: zc20040714
      TEXT2VEC_MODEL_PATH: /app/text2vec_model
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - .:/app
      - ./huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command: bash start.sh  # <--- 改成这一行！

volumes:
  pgdata:
  redis_data:
